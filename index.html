(()=>{'use strict';

const FS=`precision mediump float;uniform vec3 uSun,uSeaTint,uFog,uGrassTint;uniform float uAmbient,uFogDepth;varying vec3 vColor,vNorm;varying float vDist,vKind;
void main(){vec3 base=vColor;if(vKind>0.5&&vKind<1.5)base=mix(base,uSeaTint,.75);if(vKind>1.5&&vKind<2.5)base=mix(base,uGrassTint,.58);float light=max(dot(normalize(vNorm),normalize(uSun)),0.)*.56+uAmbient;vec3 rgb=base*light;if(vKind>0.5&&vKind<1.5)rgb+=vec3(.08,.12,.17)*pow(max(0.,dot(normalize(vNorm),normalize(uSun))),6.);float fog=clamp((vDist-23.)/uFogDepth,0.,.94);gl_FragColor=vec4(mix(rgb,uFog,fog),1.);}`;
