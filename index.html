<div id="start"><div class="welcome"><div class="graphic">🏯</div><h1>海岛禅修</h1><h2>一座可以停下来的岛</h2><p>走进佛堂的六十六席禅堂，也能去禅居喝茶、静坐。<br>海风、四季与日升月落，自会缓缓经过。</p><button id="play" disabled>正在加载场景…</button><footer>永久免费 · 支持电脑与手机 · 浏览器真实 3D 场景 · Unity 工程独立保留</footer></div></div>

<script>

function startIslandZen2D(){
 'use strict';
 const old=document.getElementById('view'),canvas=document.createElement('canvas');canvas.id='view';canvas.setAttribute('aria-label','海岛禅修兼容画面');old.replaceWith(canvas);
 const ctx=canvas.getContext('2d',{alpha:false});if(!ctx){document.getElementById('error').style.display='flex';return;}
 const $=id=>document.getElementById(id), seasons=[{n:'春',water:'#74c7c6',grass:'#a5bf86',flower:'#f3bed0'},{n:'夏',water:'#41bbd4',grass:'#80ae66',flower:'#f9d9a0'},{n:'秋',water:'#5aa9b0',grass:'#b0a06a',flower:'#e6bb86'},{n:'冬',water:'#85aab7',grass:'#bbc5af',flower:'#fafbff'}];
 const keys=new Set(),state={x:0,z:9,season:0,day:0,sit:false,playing:false};const origin=Date.now();let W=0,H=0,dpr=1,last=0,toastEnd=0;
 function message(t){const el=$('toast');el.textContent=t;el.classList.add('on');toastEnd=performance.now()+2200;}

 function season(){return (Math.floor((Date.now()-origin)/7200000)+state.season)%4}
 function phase(){let v=(Date.now()-origin)/5400000+state.day;return ((v%1)+1)%1}

 function landscape(){let p=phase();return p<.73?1:p<.82?1-(p-.73)/.09*.72:p<.93?.23:.23+(p-.93)/.07*.77}
 function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
 function color(h,b){let v=hexRGB(h);return `rgb(${v.map(x=>Math.round(x*b)).join(',')})`}
 function oval(x,y,rx,ry,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,2*Math.PI);ctx.fill()}
 function line(x1,y1,x2,y2,stroke,w=1){ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
 function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
 function poly(points,fill){ctx.fillStyle=fill;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}
 function drawMonk(x,y,t,sit){ctx.save();ctx.translate(x,y);const bob=sit?0:Math.sin(t*7)*1.5;ctx.translate(0,bob);oval(0,12,14,5,'#52625455');ctx.strokeStyle='#f4ce7b';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,-16,12,4,0,0,Math.PI*2);ctx.stroke();if(sit){oval(0,5,18,9,'#b36e39');oval(0,-6,11,12,'#d6a16c')}else{poly([[-9,10],[9,10],[12,-4],[-12,-4]],'#af7044');oval(0,-5,10,13,'#d7a070')}oval(0,-21,10,10,'#f2d5af');ctx.fillStyle='#63462d';ctx.fillRect(-5,-22,2,1.5);ctx.fillRect(3,-22,2,1.5);ctx.restore()}
 function drawTree(x,y,s){oval(x+3*s,y+7*s,16*s,5*s,'#54735b44');line(x,y,x+2*s,y-26*s,'#75674c',5*s);for(let [dx,dy,r] of [[-10,-29,12],[10,-35,13],[0,-44,14],[16,-22,10]])oval(x+dx*s,y+dy*s,r*s,r*.8*s,['#659873','#82ab84','#a1b981','#6b9877'][Math.abs(dx)%4]);}
 function frame(t){let dt=Math.min((t-last)/1000,.06)||.016;last=t;
  if(state.playing&&!state.sit){let dx=0,dz=0;const key=(...s)=>s.some(k=>keys.has(k));if(key('w','arrowup'))dz--;if(key('s','arrowdown'))dz++;if(key('a','arrowleft'))dx--;if(key('d','arrowright'))dx++;let L=Math.hypot(dx,dz)||1,spd=key('shift')?8.3:4.6;dx=dx/L*spd*dt;dz=dz/L*spd*dt;let nx=state.x+dx,nz=state.z+dz;if(nx*nx+nz*nz<21*21){state.x=nx;state.z=nz;}}
  const bright=landscape(),s=seasons[season()],p=phase();let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,color(p>.73&&p<.95?'#d99783':'#c4e8eb',bright*.8+.2));sky.addColorStop(1,color(s.water,bright*.85+.15));ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // moving sea streaks, island and near-shore wave rings.
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.5;for(let i=0;i<28;i++){let yy=(i*47+t*.018)%H;for(let j=0;j<8;j++){let xx=j*170+Math.sin(i*7+j*5)*32;ctx.beginPath();ctx.moveTo(xx,yy);ctx.quadraticCurveTo(xx+22,yy-5,xx+57,yy);ctx.stroke()}}
  const R=Math.min(H*.53,W*.41,350),cx=W*.5,cy=H*.64,sc=R/28;
  oval(cx,cy+13,R*1.04,R*.82,'rgba(28,97,103,.28)');oval(cx,cy+7,R*1.03,R*.81,'rgba(219,248,242,.65)');oval(cx,cy,R,R*.78,color('#edd6a5',bright*.86+.15));oval(cx,cy-R*.11,R*.79,R*.56,color(s.grass,bright*.84+.15));
  // dune edges, coastline flowers and pebble footpath.
  for(let i=0;i<45;i++){let a=i*5.7,rr=R*.87,xx=cx+Math.cos(a)*rr,yy=cy+Math.sin(a)*rr*.76;oval(xx,yy,1.5+((i*7)%4),1.6, i%3?'#f5e6c8':'#dcb989')}
  let templeY=cy-R*.40;for(let i=0;i<12;i++){let y=templeY+R*.26+i*(R*.043),x=cx+Math.sin(i*.42)*R*.025;rounded(x-R*.039,y,R*.078,R*.018,4,i%2?'#d7ccb0':'#e7d9bb')}

  // open temple and golden Buddha, coherent with island layout.
  const tw=R*.59,ty=templeY,th=R*.29;
  rounded(cx-tw*.46,ty+th*.15,tw*.92,th*.48,5,color('#dfd4b8',bright*.84+.16));
  rounded(cx-tw*.43,ty+th*.05,tw*.86,th*.44,3,color('#f5e0b7',bright*.76+.24));
  for(let i=-3;i<=3;i++){let xx=cx+i*tw*.125;rounded(xx-3,ty+th*.03,6,th*.48,2,color('#9f5545',bright*.84+.16));}
  poly([[cx-tw*.57,ty+th*.05],[cx+tw*.57,ty+th*.05],[cx+tw*.28,ty-th*.28],[cx-tw*.28,ty-th*.28]],color('#355b58',bright*.84+.16));poly([[cx-tw*.33,ty-th*.24],[cx+tw*.33,ty-th*.24],[cx+tw*.19,ty-th*.44],[cx-tw*.19,ty-th*.44]],color('#496c61',bright*.86+.14));
  rounded(cx-tw*.19,ty-th*.31,tw*.38,th*.07,3,'#be9a5d');oval(cx,ty+th*.23,R*.045,R*.06,'#d8af65');oval(cx,ty+th*.13,R*.025,R*.04,'#e8c17e');
  for(let i=-3;i<=3;i++){let xx=cx+i*tw*.1;oval(xx,ty+th*.45,7*sc*.7,3*sc*.6,color('#aa8356',bright*.9+.1))}
  // 禅居与茶亭：兼容画面也保持主要场景位置。
  rounded(cx-R*.80,ty+th*.30,R*.21,th*.22,3,color('#ecd4b0',bright*.82+.18));
  poly([[cx-R*.84,ty+th*.30],[cx-R*.57,ty+th*.30],[cx-R*.65,ty+th*.10],[cx-R*.77,ty+th*.10]],color('#355b58',bright*.85+.15));
  rounded(cx+R*.56,ty+th*.31,R*.18,th*.19,3,color('#dfc3a1',bright*.82+.18));
  poly([[cx+R*.53,ty+th*.31],[cx+R*.77,ty+th*.31],[cx+R*.70,ty+th*.14],[cx+R*.60,ty+th*.14]],color('#46675d',bright*.85+.15));
  ctx.fillStyle=color('#6d5c43',bright*.7+.3);ctx.font='bold '+Math.max(10,Math.floor(R*.043))+'px sans-serif';ctx.fillText('禅居',cx-R*.78,ty+th*.52);
  // Character worldspace + subtle trail and meditation visual.
  const mx=cx+state.x*sc,my=cy+state.z*sc*.79;drawMonk(mx,my,t/1000,state.sit);
  if(state.sit){ctx.strokeStyle='#f2e3b3aa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(mx,my,22+Math.sin(t*.002)*2,0,Math.PI*2);ctx.stroke()}

  if(bright<.65){ctx.fillStyle=`rgba(22,37,64,${(.65-bright)*.43})`;ctx.fillRect(0,0,W,H)}

  const sunX=W*.80,sunY=H*.19;oval(sunX,sunY,bright<.48?11:22,bright<.48?11:22,bright<.48?'#f2f1d7':'#ffe2a0');
  $('seasonLabel').textContent=s.n+' · '+daylight()+' · 2D兼容模式';$('clockLabel').textContent='四季每2小时 · 昼夜90分钟';$('timefill').style.width=Math.round(p*100)+'%';
  if(t>toastEnd)$('toast').classList.remove('on');requestAnimationFrame(frame)
 }
 function toggleSit(){state.sit=!state.sit;$('meditate').textContent=state.sit?'☯ 起身':'☯ 静坐';$('meditate').classList.toggle('on',state.sit);message(state.sit?'闭目静坐，听海风慢慢经过。':'站起来，再去走走。')}
 $('play').onclick=()=>{state.playing=true;$('start').style.display='none';message('欢迎来到海岛，WASD 或方向键自由漫步。')};
 $('seasons').onclick=()=>{state.season=(state.season+1)%4;message('四季轮转 · '+seasons[season()].n)};
 $('tod').onclick=()=>{let p=phase();state.day=(state.day+(p<.78?.79-p:p<.92?.94-p:1.2-p))%1;message('时间流转 · '+daylight())};
 $('home').onclick=()=>{state.x=0;state.z=18;state.sit=false;$('meditate').textContent='☯ 静坐';$('meditate').classList.remove('on');message('回到海边')};

 addEventListener('keydown',e=>{let k=e.key.toLowerCase();if('wasd'.includes(k)||k.startsWith('arrow')||k==='shift'||k===' '){keys.add(k);e.preventDefault();if(k===' '&&!e.repeat)toggleSit()}});
