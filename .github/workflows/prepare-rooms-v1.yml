name: Prepare multiplayer temple client
on:
  push:
    branches: [prepare-rooms-v1]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and stage the room-enabled game files
        run: |
          node tools/prepare-rooms-v1.mjs .
          node --check temple-client.js
          git add -- play.html temple-client.js
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Prepare shared rooms for the landscape temple"
          git push origin HEAD:refs/heads/rooms-verified-payload-v1
